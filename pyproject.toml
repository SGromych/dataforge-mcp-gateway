[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge-mcp"
version = "0.3.1"
description = "DataForge Semantic MCP Server - read and write access to the DataForge semantic layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    # 2.x is a different registration API: the server takes on_list_tools /
    # on_call_tool instead of the 1.x @server.list_tools() decorators, and it no
    # longer validates tool arguments (mcp/arguments.py does). Both bounds matter -
    # 1.x cannot run this code, and 3.x has not been seen.
    "mcp>=2.2,<3",
    "starlette>=1.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.3",
    "jsonschema>=4.20",
]

[project.scripts]
dataforge-mcp = "dataforge_mcp.cli:main"

# The distribution must not depend on .gitignore. A stray `cache/` rule once matched
# src/dataforge_mcp/cache/ and hatchling, which honours VCS ignore files by default,
# silently shipped a wheel without that package: `pip install` succeeded and
# `python -m dataforge_mcp` died with ModuleNotFoundError.
[tool.hatch.build]
ignore-vcs = true
exclude = ["__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/api/", "README.md", "CLAUDE.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
